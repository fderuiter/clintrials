repos:
-   repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.1.14
    hooks:
    -   id: ruff
        args: [ --fix ]
-   repo: https://github.com/jendrikseipp/vulture
    rev: v2.11
    hooks:
    -   id: vulture
        args: ["clintrials", ".vulture_whitelist.py"]
-   repo: local
    hooks:
    -   id: mypy
        name: mypy
        entry: poetry run mypy
        language: system
        files: ^(clintrials/|tests/)
        types_or: [python, pyi]
        pass_filenames: true

    -   id: deptry
        name: deptry
        entry: deptry .
        language: python
        additional_dependencies: ["deptry==0.22.0"]
        pass_filenames: false
        always_run: true

    -   id: verify-api-signatures
        name: verify-api-signatures
        entry: poetry run python scripts/verify_api_signatures.py
        language: system
        pass_filenames: false
        always_run: true

    -   id: ast-ui-linter
        name: ast-ui-linter
        entry: poetry run python scripts/ast_ui_linter.py
        language: system
        files: ^(clintrials/|tests/)visualization/dashboard/views/
        pass_filenames: true
