[project]
name = "clintrials"
version = "0.1.4"
description = "clintrials is a library of clinical trial designs and methods in Python"
readme = "README.md"
requires-python = ">=3.9, !=3.9.7"
license = "MIT"
authors = [
    {name = "Kristian Brock", email = "kristian.brock@gmail.com"}
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "numpy>=1.21.0,<2.0.0",
    "pandas>=1.3.0",
    "scipy>=1.7.0",
    "statsmodels>=0.13.0",
    "packaging>=22.0",
    "tqdm>=4.68.3,<5.0.0",
]

[project.optional-dependencies]
docs = [
    "sphinx>=7.2.6,<8.0.0",
    "furo>=2024.1.29,<2026.0.0",
    "nbsphinx>=0.9.8,<0.10.0",
    "myst-parser>=2,<4",
]
viz = [
    "streamlit>=1.0.0",
    "plotly>=5.0.0",
    "matplotlib>=3.5.0",
    "fpdf2>=2.7.9,<3.0.0",
]

[project.urls]
homepage = "https://github.com/brockk/clintrials"
repository = "https://github.com/brockk/clintrials"

[project.scripts]
dashboard = "clintrials.visualization.dashboard.launcher:main"


[tool.poetry.group.dev.dependencies]
pytest = [
    {version = "^8.2.0", python = "<3.10"},
    {version = "^9.0.3", python = ">=3.10"}
]
tomli = {version = "^2.0.1", python = "<3.11"}
coverage = "^7.0.0"
ruff = ">=0.12.5,<0.17.0"
pre-commit = "^4.2.0"
pytest-mock = "^3.12.0"
hypothesis = "^6.98.13"
ipython = "<9.0.0"
ipykernel = "<7"
mypy = "<1.20.0"

[tool.poetry.group.a11y]
optional = true

[tool.poetry.group.a11y.dependencies]
pytest-playwright = ">=0.4.0"
axe-playwright-python = ">=0.1.0"
playwright = ">=1.40.0"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.semantic_release]
version_variable = "pyproject.toml:project.version"
branch = "main"
changelog_file = "CHANGELOG.md"
tag_format = "v{version}"
upload_to_pypi = false
commit_author = "github-actions <github-actions@github.com>"

[tool.black]
line-length = 88
target-version = ["py39"]

[tool.isort]
profile = "black"
line_length = 88

[tool.ruff]
line-length = 88
target-version = "py39"
exclude = ["docs/tutorials/", ".vulture_whitelist.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "D"]
extend-select = ["T201", "D102", "D103", "D417", "TID251"]
ignore = [
    "E203",
    "E402",
    "E731",
    "E722",
    "E741",
    "E712",
    "E501",
    "E713",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D", "TID251"]
"tests/*" = ["D", "TID251"]
"clintrials/core/*" = ["TID251"]
"clintrials/__init__.py" = ["D"]
"clintrials/phase3/__init__.py" = ["D"]
"clintrials/utils.py" = ["D"]
"clintrials/winratio/main.py" = ["D"]
"docs/conf.py" = ["D"]


[tool.ruff.lint.flake8-tidy-imports.banned-api]
"clintrials.core.registry.REGISTRY".msg = "Namespace collision: Use CORE_REGISTRY instead."
"clintrials.visualization.dashboard.factory.REGISTRY".msg = "Namespace collision: Use UI_REGISTRY instead."
"scipy.stats.norm".msg = "Redundant math: Use unified helpers in clintrials.core statistics instead."
"scipy.stats.chi2".msg = "Redundant math: Use clintrials.core.stats.calc_pearson_chi_square instead."
"scipy.stats.chi2.cdf".msg = "Redundant math: Use clintrials.core.stats.calc_pearson_chi_square instead."


[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = true
ignore_missing_imports = true
disallow_any_unimported = false

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = "tests.test_accessibility"
warn_unused_ignores = false

[[tool.mypy.overrides]]
module = "scipy.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "pandas.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "statsmodels.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "plotly.*"
ignore_missing_imports = true


[tool.coverage.run]
source = ["clintrials"]
branch = true
omit = [
    "*/__main__*",
    "tests/*"
]

[tool.coverage.report]
fail_under = 70

[tool.pytest.ini_options]
addopts = "--ignore=tests/test_accessibility.py"
testpaths = ["tests"]
filterwarnings = [
    "error::DeprecationWarning:clintrials.*",
    "error::DeprecationWarning:tests.*",
]



[tool.deptry]
extend_exclude = ["docs/", "scripts/"]

[tool.deptry.package_module_name_map]
fpdf2 = ["fpdf"]

[tool.deptry.per_rule_ignores]
DEP002 = ["sphinx", "furo", "matplotlib", "nbsphinx", "myst-parser"]
