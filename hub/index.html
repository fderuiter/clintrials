<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>Trial Simulation Hub - Dynamic Configuration</title>
    <script>
      if ('serviceWorker' in navigator) {
        var isSubpath = window.location.pathname.indexOf('/clintrials/') !== -1;
        var swUrl = isSubpath ? '/clintrials/sw.js' : '/sw.js';
        var swScope = isSubpath ? '/clintrials/' : '/';
        navigator.serviceWorker.register(swUrl, { scope: swScope })
          .then(function (reg) {
            console.log('SW registered on root scope:', reg.scope);
          })
          .catch(function (err) {
            console.log('SW registration failed:', err);
          });
      }
    </script>
    <style>
      body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        margin: 0;
        padding: 40px;
        background-color: #F0F2F6;
        color: #31333F;
      }
      .container {
        max-width: 800px;
        margin: 0 auto;
        background: #FFFFFF;
        padding: 30px;
        border-radius: 8px;
        box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      }
      h1 {
        color: #496D89;
      }
      select {
        width: 100%;
        padding: 10px;
        margin-bottom: 30px;
        font-size: 16px;
        border-radius: 4px;
        border: 1px solid #ccc;
      }
      .form-group {
        margin-bottom: 20px;
        padding-bottom: 20px;
        border-bottom: 1px solid #eee;
      }
      .form-group:last-child {
        border-bottom: none;
      }
      label {
        display: block;
        font-weight: 600;
        margin-bottom: 8px;
      }
      .description {
        font-size: 0.85em;
        color: #666;
        margin-bottom: 8px;
        font-style: italic;
      }
      input, textarea {
        width: 100%;
        padding: 10px;
        box-sizing: border-box;
        border: 1px solid #ccc;
        border-radius: 4px;
        font-size: 16px;
        font-family: inherit;
      }
      input.invalid, textarea.invalid {
        border-color: #dc3545;
        background-color: #f8d7da;
      }
      .error-msg {
        color: #dc3545;
        font-size: 0.85em;
        margin-top: 5px;
        display: none;
      }
      button.submit {
        background-color: #496D89;
        color: white;
        border: none;
        padding: 12px 20px;
        font-size: 16px;
        border-radius: 4px;
        cursor: pointer;
        margin-top: 20px;
      }
      button.submit:hover {
        background-color: #365267;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Simulation Configuration</h1>
      <p>Select a trial model to configure parameters.</p>
      
      <!-- Dedicated, idempotent error region -->
      <div id="error-region"></div>

      <select id="schema-selector">
        <option value="">-- Select Model Schema --</option>
      </select>
      
      <form id="dynamic-form" style="display: none;">
        <div id="form-fields"></div>
        <button type="submit" class="submit">Run Simulation</button>
      </form>
    </div>

    <script>
      const LABEL_MAPPING = {
        // Schema Names
        'WinRatioSchema': 'Win Ratio',
        'CRMSchema': 'Continual Reassessment Method',
        'EffToxSchema': 'EffTox',
        'WagesTaitSchema': 'Wages & Tait',
        'WATUSchema': 'WATU',
        'GroupSequentialDesignSchema': 'Group Sequential Designs',

        // Parameters
        'num_subjects_A': 'Number of Subjects (Group A)',
        'num_subjects_B': 'Number of Subjects (Group B)',
        'num_simulations': 'Number of Simulations',
        'p_y1_A': 'Probability of y1 (Group A)',
        'p_y1_B': 'Probability of y1 (Group B)',
        'p_y2_A': 'Probability of y2 (Group A)',
        'p_y2_B': 'Probability of y2 (Group B)',
        'p_y3_A': 'Probability of y3 (Group A)',
        'p_y3_B': 'Probability of y3 (Group B)',
        'significance_level': 'Significance Level',

        'prior': 'Prior Probabilities',
        'target': 'Target Toxicity Probability',
        'first_dose': 'Starting Dose Level',
        'max_size': 'Maximum Sample Size',
        'lowest_dose_too_toxic_hurdle': 'Lowest Dose Too Toxic Hurdle',
        'lowest_dose_too_toxic_certainty': 'Lowest Dose Too Toxic Certainty',
        'coherency_threshold': 'Coherency Threshold',
        'bootstrap_samples': 'Bootstrap Samples',
        'min_beta': 'Minimum Beta',
        'max_beta': 'Maximum Beta',
        'n_points': 'Number of Points',
        'sample_size': 'Sample Size',

        'real_doses': 'Real Doses',
        'prior_tox_probs': 'Prior Toxicity Probabilities',
        'prior_eff_probs': 'Prior Efficacy Probabilities',
        'tox_cutoff': 'Toxicity Cutoff',
        'eff_cutoff': 'Efficacy Cutoff',
        'tox_certainty': 'Toxicity Certainty',
        'eff_certainty': 'Efficacy Certainty',

        'skeletons': 'Efficacy Skeletons',
        'tox_target': 'Target Toxicity Rate',
        'tox_limit': 'Maximum Acceptable Toxicity',
        'eff_limit': 'Minimum Acceptable Efficacy',
        'randomisation_stage_size': 'Randomization Stage Size',

        'stage_one_size': 'Stage One Size',

        'k': 'Number of Analyses (Looks)',
        'alpha': 'Overall Significance Level (Alpha)',
        'timing': 'Information Fractions (Timing)'
      };

      let schemas = {};

      function showError(message) {
        const errorRegion = document.getElementById('error-region');
        if (errorRegion) {
          errorRegion.innerHTML = '';
          const p = document.createElement('p');
          p.style.color = 'red';
          p.textContent = message;
          errorRegion.appendChild(p);
        }
      }

      function clearError() {
        const errorRegion = document.getElementById('error-region');
        if (errorRegion) {
          errorRegion.innerHTML = '';
        }
      }

      async function initializeApp() {
        clearError();

        let response;
        try {
          response = await fetch('schema.json', { cache: 'no-store' });
        } catch (netErr) {
          console.error("Network error loading schema.json:", netErr);
          showError("Schema failed to load (network/404 failure).");
          return;
        }

        if (!response.ok) {
          console.error("HTTP error loading schema.json:", response.status);
          showError("Schema failed to load (network/404 failure).");
          return;
        }

        try {
          schemas = await response.json();
          
          // Validate schema is non-empty and shaped as expected
          const isValid = schemas &&
                          typeof schemas === 'object' &&
                          !Array.isArray(schemas) &&
                          Object.keys(schemas).length > 0;

          if (!isValid) {
            throw new Error("Empty schemas");
          }

          for (const schemaName in schemas) {
            if (!schemas[schemaName] || typeof schemas[schemaName] !== 'object' || !schemas[schemaName].properties || typeof schemas[schemaName].properties !== 'object') {
              throw new Error("Invalid schema shape");
            }
          }
        } catch (parseOrValErr) {
          console.error("Schema validation/parsing error:", parseOrValErr);
          showError("Schema loaded but empty/invalid.");
          return;
        }

        try {
          const selector = document.getElementById('schema-selector');
          // Clear any existing options except the first placeholder
          selector.innerHTML = '<option value="">-- Select Model Schema --</option>';

          for (const schemaName in schemas) {
            const option = document.createElement('option');
            option.value = schemaName;
            option.textContent = LABEL_MAPPING[schemaName] || schemaName.replace('Schema', ' Model');
            selector.appendChild(option);
          }
          
          selector.addEventListener('change', (e) => {
            renderForm(e.target.value);
          });
        } catch (err) {
          console.error("Dropdown population error:", err);
          showError("Schema loaded but empty/invalid.");
        }
      }

      function validateField(input, prop, errorEl) {
        let isValid = true;
        let errorMsg = '';
        const val = input.value;

        if (prop.type === 'array') {
           if (val.trim() === '') {
              // Not required unless specified, keeping simple
           } else {
              const isMulti = prop.items && prop.items.type === 'array';
              if (isMulti) {
                 try {
                    const parsed = JSON.parse(val);
                    if (!Array.isArray(parsed)) {
                       isValid = false;
                       errorMsg = 'Must be a valid JSON array';
                    } else {
                       const subItemSchema = prop.items.items;
                       for (let i = 0; i < parsed.length; i++) {
                          const row = parsed[i];
                          if (!Array.isArray(row)) {
                             isValid = false;
                             errorMsg = 'Must be a multi-dimensional array (array of arrays)';
                             break;
                          }
                          for (let j = 0; j < row.length; j++) {
                             const num = Number(row[j]);
                             if (isNaN(num)) {
                                isValid = false;
                                errorMsg = 'All array items must be numbers';
                                break;
                             }
                             if (subItemSchema) {
                                if (subItemSchema.minimum !== undefined && num < subItemSchema.minimum) {
                                   isValid = false;
                                   errorMsg = `Items must be >= ${subItemSchema.minimum}`;
                                   break;
                                }
                                if (subItemSchema.maximum !== undefined && num > subItemSchema.maximum) {
                                   isValid = false;
                                   errorMsg = `Items must be <= ${subItemSchema.maximum}`;
                                   break;
                                }
                             }
                          }
                          if (!isValid) break;
                       }
                    }
                 } catch (err) {
                    isValid = false;
                    errorMsg = 'Must be a valid JSON array format';
                 }
              } else {
                 const items = val.split(',').map(s => s.trim());
                 const itemSchema = prop.items;
                 if (itemSchema && (itemSchema.type === 'number' || itemSchema.type === 'integer')) {
                    for (const item of items) {
                       const num = Number(item);
                       if (isNaN(num)) {
                          isValid = false;
                          errorMsg = 'All array items must be numbers';
                          break;
                       }
                       if (itemSchema.minimum !== undefined && num < itemSchema.minimum) {
                          isValid = false; errorMsg = `Items must be >= ${itemSchema.minimum}`; break;
                       }
                       if (itemSchema.maximum !== undefined && num > itemSchema.maximum) {
                          isValid = false; errorMsg = `Items must be <= ${itemSchema.maximum}`; break;
                       }
                    }
                 }
              }
           }
        } else if (prop.type === 'integer' || prop.type === 'number') {
          if (val === '') {
             // assuming required fields are handled on submit
          } else {
            const num = Number(val);
            if (isNaN(num)) {
              isValid = false;
              errorMsg = 'Must be a valid number';
            } else {
              if (prop.type === 'integer' && !Number.isInteger(num)) {
                isValid = false;
                errorMsg = 'Must be an integer';
              }
              if (prop.minimum !== undefined && num < prop.minimum) {
                isValid = false;
                errorMsg = `Value must be >= ${prop.minimum}`;
              }
              if (prop.maximum !== undefined && num > prop.maximum) {
                isValid = false;
                errorMsg = `Value must be <= ${prop.maximum}`;
              }
              if (prop.exclusiveMinimum !== undefined && num <= prop.exclusiveMinimum) {
                isValid = false;
                errorMsg = `Value must be strictly > ${prop.exclusiveMinimum}`;
              }
              if (prop.exclusiveMaximum !== undefined && num >= prop.exclusiveMaximum) {
                isValid = false;
                errorMsg = `Value must be strictly < ${prop.exclusiveMaximum}`;
              }
            }
          }
        }

        if (!isValid) {
          input.classList.add('invalid');
          errorEl.textContent = errorMsg;
          errorEl.style.display = 'block';
        } else {
          input.classList.remove('invalid');
          errorEl.style.display = 'none';
        }
        return isValid;
      }

      function renderForm(schemaName) {
        const form = document.getElementById('dynamic-form');
        const formFields = document.getElementById('form-fields');
        formFields.innerHTML = '';
        
        clearError();

        if (!schemaName) {
          form.style.display = 'none';
          return;
        }

        const schema = schemas[schemaName];
        if (!schema || !schema.properties) {
          form.style.display = 'none';
          showError(`Selected schema "${schemaName}" is missing or invalid.`);
          return;
        }

        // Only set the form's display = 'block' after successful validation of the schema entry
        form.style.display = 'block';

        const properties = schema.properties;
        const required = schema.required || [];

        for (const [key, prop] of Object.entries(properties)) {
          const group = document.createElement('div');
          group.className = 'form-group';

          const label = document.createElement('label');
          const cleanLabel = LABEL_MAPPING[key] || key;
          label.textContent = cleanLabel + (required.includes(key) ? ' *' : '');
          label.setAttribute('for', key);

          if (prop.description) {
            const desc = document.createElement('div');
            desc.className = 'description';
            desc.textContent = prop.description;
            desc.title = prop.description;
            group.appendChild(desc);
          }

          const isMulti = prop.type === 'array' && prop.items && prop.items.type === 'array';
          const input = isMulti ? document.createElement('textarea') : document.createElement('input');
          input.id = key;
          input.name = key;

          if (!isMulti) {
            if (prop.type === 'integer' || prop.type === 'number') {
              input.type = 'number';
              if (prop.type === 'number') input.step = 'any';
              if (prop.minimum !== undefined) input.min = prop.minimum;
              if (prop.maximum !== undefined) input.max = prop.maximum;
            } else {
              input.type = 'text';
              if (prop.type === 'array') {
                input.placeholder = 'e.g., 0.1, 0.2, 0.3';
              }
            }
          } else {
            input.placeholder = 'e.g., [[0.1, 0.2], [0.3, 0.4]]';
            input.rows = 4;
          }

          if (prop.default !== undefined) {
             if (prop.type === 'array') {
               if (isMulti) {
                 input.value = JSON.stringify(prop.default);
               } else {
                 input.value = Array.isArray(prop.default) ? prop.default.join(', ') : prop.default;
               }
             } else {
               input.value = prop.default;
             }
          }
          
          if (required.includes(key)) {
            input.required = true;
          }

          const error = document.createElement('div');
          error.className = 'error-msg';
          error.id = key + '-error';

          input.addEventListener('input', () => {
             validateField(input, prop, error);
          });

          group.appendChild(label);
          group.appendChild(input);
          group.appendChild(error);
          
          formFields.appendChild(group);
          
          // trigger validation for defaults
          if (input.value) {
             validateField(input, prop, error);
          }
        }
        
        form.onsubmit = (e) => {
           e.preventDefault();
           let allValid = true;
           const payload = {};

           for (const [key, prop] of Object.entries(properties)) {
              const input = document.getElementById(key);
              const error = document.getElementById(key + '-error');
              if (!validateField(input, prop, error)) {
                 allValid = false;
              } else {
                 const val = input.value;
                 if (val.trim() === '') {
                    payload[key] = null;
                 } else if (prop.type === 'integer' || prop.type === 'number') {
                    payload[key] = Number(val);
                 } else if (prop.type === 'boolean') {
                    payload[key] = (val === 'true');
                 } else if (prop.type === 'array') {
                    const isMulti = prop.items && prop.items.type === 'array';
                    if (isMulti) {
                       payload[key] = JSON.parse(val);
                    } else {
                       payload[key] = val.split(',').map(s => Number(s.trim()));
                    }
                 } else {
                    payload[key] = val;
                 }
              }
           }
           if (allValid) {
              console.log("Submitting payload:", payload);
              fetch('api/simulate', {
                 method: 'POST',
                 headers: {
                    'Content-Type': 'application/json'
                 },
                 body: JSON.stringify(payload)
              }).then(res => {
                 console.log("Response from mock backend:", res);
              }).catch(err => {
                 console.error("Fetch error (expected if no real backend is running):", err);
              });

              alert("Simulation configuration valid and submitted!");
           } else {
              alert("Please correct validation errors before submitting.");
           }
        };
      }

      window.addEventListener('DOMContentLoaded', initializeApp);

      // Register dedicated scoped service worker for the Simulation Hub
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          const isSubpath = window.location.pathname.includes('/clintrials/');
          const swUrl = isSubpath ? '/clintrials/hub/sw.js' : '/hub/sw.js';
          const swScope = isSubpath ? '/clintrials/hub/' : '/hub/';
          navigator.serviceWorker.register(swUrl, { scope: swScope })
            .then(reg => console.log('Simulation Hub SW registered with scope:', reg.scope))
            .catch(err => console.log('Simulation Hub SW registration failed:', err));
        });
      }
    </script>
  </body>
</html>
